# ============================================================
#  潮汐 Tide · nginx 站点配置（纯 HTTP，证书签发前的过渡配置）
#  用途：让 Let's Encrypt 的 HTTP-01 验证能通过
#  证书签好后重跑 setup-server.sh，会自动换成 nginx-tide.conf（HTTPS 版）
#
#  占位符：__DOMAIN__ / __ROOT__ / __PORT__
# ============================================================

server {
    listen       80;
    listen       [::]:80;
    server_name  __DOMAIN__;

    root  __ROOT__;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/tide.access.log;
    error_log  /var/log/nginx/tide.error.log warn;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # 证书验证路径，必须在隐藏文件拦截之前用 ^~ 短路
    location ^~ /.well-known/acme-challenge/ {
        root  __ROOT__;
        default_type text/plain;
        allow all;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    error_page 404 /index.html;
}

server {
    listen       __PORT__;
    listen       [::]:__PORT__;
    server_name  __DOMAIN__;

    root  __ROOT__;
    index index.html;
    charset utf-8;
    access_log off;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
