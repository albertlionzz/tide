# ============================================================
#  潮汐 Tide · nginx 站点配置
#  用法：放到 /etc/nginx/conf.d/tide.conf（或 sites-available 再软链）
#  部署前把 __PORT__ 替换成实际端口、__ROOT__ 替换成站点根目录
# ============================================================

server {
    listen       __PORT__;
    listen       [::]:__PORT__;
    server_name  _;

    root  __ROOT__;
    index index.html;

    charset utf-8;

    # ---- 访问日志 ----
    access_log /var/log/nginx/tide.access.log;
    error_log  /var/log/nginx/tide.error.log warn;

    # ---- 压缩：JSON 是关键，192KB -> 45KB ----
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---- 缓存策略：分三类 ----
    # 1) 每日更新的数据文件 —— 必须每次回源校验，否则用户会看到昨天的盘面
    location ~* ^/(tide_data|feed_data|screen_pool|raw_snapshot)\.json$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Data-Freshness "daily";
        try_files $uri =404;
    }

    # 2) 静态资源 —— 无构建步骤、无 hash 文件名，只能短缓存
    location ~* \.(css|js)$ {
        expires 10m;
        add_header Cache-Control "public, max-age=600, must-revalidate" always;
    }

    # 3) 图片等长缓存
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    # ---- 主页 ----
    location = / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ---- 安全 ----
    # 禁止访问隐藏文件（.git / .gitignore / .env 等）
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 屏蔽非交付用的脚本文件（源码留在 GitHub，不必对外暴露）
    location ~* \.(py|pyc|sh|bat|md|log)$ {
        deny all;
        access_log off;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- 错误页 ----
    error_page 404 /index.html;
}
