# ============================================================
#  潮汐 Tide · nginx 站点配置（HTTPS）
#  用法：放到 /etc/nginx/conf.d/tide.conf
#
#  占位符（由 setup-server.sh 替换）：
#    __DOMAIN__    域名，多个用空格分隔，如 "artsi.site www.artsi.site"
#    __ROOT__      站点根目录，如 /var/www/tide
#    __CERT_DIR__  证书目录，如 /etc/letsencrypt/live/artsi.site
#    __PORT__      明文备用端口，如 8080
#
#  HTTPS 证书不由本文件申请，先跑：
#    certbot certonly --webroot -w __ROOT__ -d <域名> ...
# ============================================================

# ---------- :80 仅做 ACME 验证与跳转 ----------
# 证书续期时旧证书可能已过期，验证路径必须能在 HTTP 下访问，此块不可删
server {
    listen       80;
    listen       [::]:80;
    server_name  __DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root  __ROOT__;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- :443 主站 ----------
server {
    listen       443 ssl http2;
    listen       [::]:443 ssl http2;
    server_name  __DOMAIN__;

    root  __ROOT__;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/tide.access.log;
    error_log  /var/log/nginx/tide.error.log warn;

    # ---- TLS ----
    ssl_certificate         __CERT_DIR__/fullchain.pem;
    ssl_certificate_key     __CERT_DIR__/privkey.pem;
    ssl_trusted_certificate __CERT_DIR__/chain.pem;
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache       shared:SSL:10m;
    ssl_session_timeout     1d;
    ssl_session_tickets     off;
    ssl_stapling            on;
    ssl_stapling_verify     on;
    resolver                223.5.5.5 119.29.29.29 valid=300s;
    resolver_timeout        5s;

    # ---- 压缩：JSON 是关键，192KB -> 45KB ----
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---- 图标：文件不存在时返回 204，避免 404 被 error_page 吞成 HTML ----
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files /favicon.ico =204;
    }

    # ---- 缓存策略：分三类 ----
    # 1) 每日更新的数据文件 —— 必须每次回源校验，否则用户会看到昨天的盘面
    #    注意：location 里只要有 add_header，server 层的 add_header 就全部失效，
    #    所以下面每个 location 都要 include 一次安全头
    location ~* ^/(tide_data|feed_data|screen_pool|raw_snapshot)\.json$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Data-Freshness "daily" always;
        include /etc/nginx/snippets/tide-headers.conf;
        try_files $uri =404;
    }

    # 2) 静态资源 —— 无构建步骤、无 hash 文件名，只能短缓存
    location ~* \.(css|js)$ {
        expires 10m;
        add_header Cache-Control "public, max-age=600, must-revalidate" always;
        include /etc/nginx/snippets/tide-headers.conf;
    }

    # 3) 图片等长缓存
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        include /etc/nginx/snippets/tide-headers.conf;
    }

    # ---- 主页 ----
    location = / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/tide-headers.conf;
        try_files /index.html =404;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/tide-headers.conf;
        try_files $uri $uri/ =404;
    }

    # ---- 安全 ----
    # 禁止访问隐藏文件（.git / .gitignore / .env 等）
    # 注意：这条正则也会命中 /.well-known/，所以 ACME 例外必须用 ^~ 前缀短路
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 屏蔽非交付用的脚本文件（源码留在 GitHub，不必对外暴露）
    location ~* \.(py|pyc|sh|bat|md|log)$ {
        deny all;
        access_log off;
    }

    # ---- 错误页 ----
    error_page 404 /index.html;
}

# ---------- :__PORT__ 明文备用通道 ----------
# 证书过期或 TLS 配置出错时仍能进站排查，因此刻意保留 HTTP
server {
    listen       __PORT__;
    listen       [::]:__PORT__;
    server_name  __DOMAIN__;

    root  __ROOT__;
    index index.html;
    charset utf-8;

    access_log off;

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
